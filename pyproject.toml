[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dh2a-kt"
version = "0.1.0"
description = "Leakage-audited knowledge attribution for knowledge tracing (DH2A-KT)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Tuan Dao Minh" },
  { name = "Khanh-Trinh Nguyen" },
  { name = "Duong Nguyen Tien" },
  { name = "Quoc Khanh Ngo" },
  { name = "Van-Hau Nguyen" },
  { name = "Le Hoang Son" },
]
urls = { Homepage = "https://github.com/edu-risk-lab/DH2A-KT" }

[tool.setuptools]
packages = ["dh2a_kt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs real P0 processed data or long-running integration checks",
]
