# Lean config for supervisor baseline verify (neo: ASSISTments 2012, pyKT only).
# Inherits same paths/preprocess/split as assist2012.yaml; fewer models, no graph ablation.

dataset: assist2012
raw_path: data/raw/assist2012/
raw_interactions_file: data/raw/assist2012/2012-2013-data-with-predictions-4-final.csv
processed_path: data/processed/assist2012.parquet
has_dag: false
schema_mapping:
  user_id: user_id
  item_id: problem_id
  kc_id: [skill_id, skill]
  timestamp: start_time
  correct: correct
preprocess:
  correct_mode: binary_only
split:
  type: learner_temporal
  ratios: [0.7, 0.1, 0.2]
  seed: 42
  n_folds: 3
graph:
  e_pre_source: inferred
  e_pre_support_quantile: 0.95
  e_pre_top_k_per_node: 5
  e_pre_max_edges: 5000
  e_sim_method: jaccard
  e_sim_threshold: 0.10
dag_audit:
  prune_strategy: lowest_confidence_first
cold_start:
  bins: [[-1, 19], [20, 99], [100, 499], [500, 10000000]]
  metrics: [auc, acc, nll]
baselines:
  - name: bkt
    enabled: true
  - name: dkt
    enabled: true
  - name: akt
    enabled: true
  - name: gkt
    enabled: true
    hyperparams:
      batch_size: 32
      epochs: 10
graph_ablation:
  enabled: false
evaluation:
  baseline_backend: pykt
pykt:
  max_seq_len: 200
  gkt_graph_tag: p0_protocol
  epochs: 30
  batch_size: 64
  lr: 0.001
logging:
  level: INFO
