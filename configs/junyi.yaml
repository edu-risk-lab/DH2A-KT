# DH2A-KT config for Junyi Academy — ground-truth cross-validation + cold-start
# role (docs/idea-D-plan.md section 5). Has an expert prerequisite DAG
# (Chang et al.) P0 already wired up for GT cross-validation (P0 Section 3.8);
# reuse that procedure for the concept-prerequisite hyperedge, not just E_pre.
p0_config: external/p0_leakage_audit/configs/junyi.yaml
dataset: junyi
role: ground_truth_crossval

hyperedge:
  concept_prerequisite:
    enabled: true
    min_chain_len: 3
    max_chain_len: 8
    source: p0_e_pre
  session:
    enabled: false
  discussion_thread:
    enabled: false
  teacher_intervention:
    enabled: false

ground_truth_crossval:
  expert_dag_path: external/p0_leakage_audit/data/raw/junyi/junyi_dag.csv
  prereq_threshold: 0.5
  top_k_list: [200, 500, 800, 1200, 1800, 2500, 3500, 5000]

manipulation_check:
  p: 0.90
  operator: node_drop
  seed: 42

baselines_reused:
  path: baselines/p0_reused/baseline_results.csv
  fold_path: baselines/p0_reused/baseline_fold_results.csv
  graph_construction: train_only
  models: [akt, bkt, dgekt, dkt, dygkt, gikt, simplekt, skt]  # note: no gkt on junyi (P0 Section 5.3: stock GKT wrapper impractical on dense multi-million-interaction graphs)
